name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest-known"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: ci_test
          DB_USER: ci_test
          DB_PASSWORD: ci_test
        run: uv run pytest -v