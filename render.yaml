services:
  - type: web
    name: support-intelligence-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend

    buildCommand: >
      uv sync --frozen &&
      uv run python -m app.scripts.prepare_database &&
      uv run alembic upgrade head

    # Free portfolio deployment:
    # FastAPI and a single Celery worker share the same instance.
    # For a real production deployment, move Celery to a
    # dedicated Render Background Worker.
    startCommand: >
      bash -c '
      uv run python -m app.scripts.create_admin &&
      {
        uv run celery
        -A app.worker.celery_app:celery_app
        worker
        --loglevel=INFO
        --pool=solo &
        exec uv run fastapi run
        --host 0.0.0.0
        --port $PORT;
      }
      '

    initialDeployHook: >
      uv run python -m app.scripts.create_admin

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.14.8

      - key: DATABASE_URL
        fromDatabase:
          name: support-intelligence-db
          property: connectionString

      - key: AUTH_SECRET_KEY
        generateValue: true

      - key: AUTH_ALGORITHM
        value: HS256

      - key: AUTH_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

      - key: AI_PROVIDER
        value: rule_based

      - key: AI_MODEL
        value: gpt-6-luna

      - key: QUEUE_BROKER_URL
        fromService:
          type: keyvalue
          name: support-intelligence-queue
          property: connectionString

      - key: QUEUE_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: support-intelligence-queue
          property: connectionString

      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false

      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  - type: keyvalue
    name: support-intelligence-queue
    plan: free
    region: frankfurt

    ipAllowList: []

    maxmemoryPolicy: noeviction

databases:
  - name: support-intelligence-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"

    databaseName: support_intelligence

    ipAllowList: []